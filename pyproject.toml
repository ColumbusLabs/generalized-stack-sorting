[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-sorting-research"
version = "0.1.0"
description = "Reproducible research on the generalized (2,2)-stack"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stack-sorting = "stack_sorting.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
